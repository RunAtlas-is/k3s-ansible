---
- name: Check for Airgap
  when: airgap_dir is defined
  block:

    - name: Distribute Airgap Artifacts
      tags:
        - distribute_artifacts
      block:
        - name: Verify Ansible meets airgap version requirements.
          ansible.builtin.assert:
            that: "ansible_version.full is version_compare('2.15', '>=')"
            msg: "The Airgap role requires at least ansible-core 2.15"

        - name: Check for existing install script
          become: false
          delegate_to: localhost
          ansible.builtin.stat:
            path: "{{ airgap_dir + '/k3s-install.sh' }}"
          register: airgap_host_install_script

        - name: Download k3s install script
          become: false
          delegate_to: localhost
          # Workaround for https://github.com/ansible/ansible/issues/64016
          when: not airgap_host_install_script.stat.exists
          ansible.builtin.get_url:
            url: https://get.k3s.io/
            timeout: 120
            dest: "{{ airgap_dir }}/k3s-install.sh"
            mode: "0755"
            checksum: "{{ k3s_install_script_checksum or omit }}"

        - name: Distribute K3s install script
          ansible.builtin.copy:
            src: "{{ airgap_dir }}/k3s-install.sh"
            dest: /usr/local/bin/k3s-install.sh
            owner: root
            group: root
            mode: "0755"

        - name: Determine architecture and set airgap_k3s_arch
          ansible.builtin.set_fact:
            airgap_k3s_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'arm' if ansible_facts['architecture'] == 'armv7l' else 'amd64' }}"

        - name: Distribute K3s binary
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: /usr/local/bin/k3s
            owner: root
            group: root
            mode: "0755"
          with_first_found:
            - files:
                - "{{ airgap_dir }}/k3s-{{ airgap_k3s_arch }}"
                - "{{ airgap_dir }}/k3s"
              # with_first_found always runs, even inside the when block
              # so we need to skip it if the file is not found
              skip: true

        # copy has no checksum parameter, so the distributed binary is read back
        # and compared explicitly. This only verifies that the file the operator
        # supplied to airgap_dir matches what they intended to ship; it says
        # nothing about the file's provenance.
        - name: Read back the distributed K3s binary checksum
          when: k3s_airgap_binary_checksum
          ansible.builtin.stat:
            path: /usr/local/bin/k3s
            checksum_algorithm: sha256
          register: airgap_k3s_binary_stat

        - name: Verify the distributed K3s binary checksum
          when: k3s_airgap_binary_checksum
          ansible.builtin.assert:
            that: airgap_k3s_binary_stat.stat.checksum == k3s_airgap_binary_checksum
            fail_msg: >-
              The K3s binary distributed to /usr/local/bin/k3s does not match
              k3s_airgap_binary_checksum. Confirm the file in airgap_dir is the
              one the checksum was computed against.

        # Dependencies are listed first so they get installed first in the next task
        - name: Distribute K3s SELinux RPM
          when: ansible_facts['os_family'] == 'RedHat' or ansible_facts['os_family'] == 'Suse'
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: /tmp/
            owner: root
            group: root
            mode: "0755"
          with_fileglob:
            - "{{ airgap_dir }}/container-selinux*.rpm"
            - "{{ airgap_dir }}/selinux-policy*.rpm"
            - "{{ airgap_dir }}/k3s-selinux*.rpm"
          register: airgap_selinux_copy
          ignore_errors: true

        - name: Install K3s SELinux RPM
          when:
            - ansible_facts['os_family'] == 'RedHat' or ansible_facts['os_family'] == 'Suse'
            - airgap_selinux_copy.skipped is false
          ansible.builtin.dnf:
            name: "{{ airgap_selinux_copy.results | selectattr('dest', 'defined') | map(attribute='dest') | list }}"
            state: present
            disable_gpg_check: true
            disablerepo: "*"

        - name: Make images directory
          ansible.builtin.file:
            path: "/var/lib/rancher/k3s/agent/images/"
            mode: "0755"
            state: directory

        - name: Distribute Airgap images
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: /var/lib/rancher/k3s/agent/images/{{ item | basename }}
            owner: root
            group: root
            mode: "0755"
          with_fileglob:
            - "{{ airgap_dir }}/*.tar.gz"
            - "{{ airgap_dir }}/*.tar.zst"
            - "{{ airgap_dir }}/*.tar"

    - name: Install Airgap K3s
      block:
        - name: Run K3s Install [server]
          when: inventory_hostname in groups[server_group] or ansible_host in groups[server_group]
          ansible.builtin.command:
            cmd: /usr/local/bin/k3s-install.sh
          environment:
            INSTALL_K3S_SKIP_ENABLE: "true"
            INSTALL_K3S_SKIP_DOWNLOAD: "true"
          changed_when: true

        - name: Run K3s Install [agent]
          when: inventory_hostname in groups[agent_group] or ansible_host in groups[agent_group]
          ansible.builtin.command:
            cmd: /usr/local/bin/k3s-install.sh
          environment:
            INSTALL_K3S_SKIP_ENABLE: "true"
            INSTALL_K3S_SKIP_DOWNLOAD: "true"
            INSTALL_K3S_EXEC: "agent"
          changed_when: true
