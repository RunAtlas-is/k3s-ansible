---
k3s_server_location: "/var/lib/rancher/k3s"
# /etc/rancher/k3s/config.yaml can contain the cluster token, so a cluster
# that does not want it world readable can narrow this to "0640".
k3s_server_config_mode: "0644"
systemd_dir: "/etc/systemd/system"  # noqa var-naming[no-role-prefix]
api_port: 6443  # noqa var-naming[no-role-prefix]
kubeconfig: ~/.kube/config.new  # noqa var-naming[no-role-prefix]
user_kubectl: true  # noqa var-naming[no-role-prefix]
cluster_context: k3s-ansible  # noqa var-naming[no-role-prefix]
server_group: server  # noqa var-naming[no-role-prefix]
agent_group: agent  # noqa var-naming[no-role-prefix]
use_external_database: false # noqa var-naming[no-role-prefix]
extra_server_args: "" # noqa var-naming[no-role-prefix]
extra_install_envs: {} # noqa var-naming[no-role-prefix]
# The name K3s registers this node under. The kubelet derives it from the OS
# nodename, which on a host with a search domain is the fully qualified name, so
# the default reads that rather than the short host name. The fallback keeps the
# role usable in a play that gathers no facts. A node installed with --node-name
# or the node-name config key needs this set to the same value, so the readiness
# gates find the node.
k3s_node_name: "{{ ansible_facts['nodename'] | default(inventory_hostname, true) | lower }}"  # noqa var-naming[no-role-prefix]
k3s_wait_ready: false  # noqa var-naming[no-role-prefix]
k3s_server_wait_etcd_voters: false
# The install script is fetched over TLS but executed as root with no
# signature check of its own. Set this to the script's sha256, in the
# "sha256:<hex>" form get_url expects, to fail the download rather than run a
# script that changed underneath the pin. Obtain it with
# `curl -sfL https://get.k3s.io | sha256sum`. The script changes with
# upstream K3s releases, so a pinned value needs updating alongside
# k3s_version. Empty by default, which leaves the download unverified as
# before.
k3s_install_script_checksum: ""  # noqa var-naming[no-role-prefix]
