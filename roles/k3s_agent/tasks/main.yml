---
# A read, so it runs in check mode too: the install decision below depends on
# the version it reports.
- name: Get k3s installed version
  ansible.builtin.command: k3s --version
  register: k3s_agent_version_output
  changed_when: false
  failed_when: false
  check_mode: false

- name: Set k3s installed version
  when: k3s_agent_version_output.rc == 0
  ansible.builtin.set_fact:
    k3s_agent_installed_version: "{{ k3s_agent_version_output.stdout_lines[0].split(' ')[2] }}"

# A check run against a host without K3s has no service to inspect yet; the
# install and the state record below still report the pending change there.
- name: Note a check run against a host without K3s
  ansible.builtin.set_fact:
    k3s_agent_check_on_clean_host: "{{ ansible_check_mode and k3s_agent_version_output.rc != 0 }}"

- name: Resolve the Kubernetes node name of this agent
  ansible.builtin.set_fact:
    k3s_agent_node_name: "{{ k3s_node_name | lower }}"

- name: Set k3s agent service files based on init system
  ansible.builtin.set_fact:
    k3s_agent_env_file: "{{ (ansible_facts['service_mgr'] == 'systemd') | ternary(systemd_dir ~ '/k3s-agent.service.env', '/etc/rancher/k3s/k3s-agent.env') }}"
    k3s_agent_unit_file: "{{ (ansible_facts['service_mgr'] == 'systemd') | ternary(systemd_dir ~ '/k3s-agent.service', '/etc/init.d/k3s-agent') }}"

# The install script rewrites the unit file and the environment file whenever
# it runs, so it runs only when K3s is missing or older than k3s_version, when
# its inputs differ from the ones recorded at the last start, or when the unit
# file no longer matches the recorded one. See the k3s_server role.
- name: Read the state K3s was last started with
  ansible.builtin.slurp:
    src: "{{ k3s_service_state_file }}"
  register: k3s_agent_service_state_recorded
  failed_when: false

- name: Read the current K3s agent unit file
  ansible.builtin.stat:
    path: "{{ k3s_agent_unit_file }}"
  register: k3s_agent_unit_stat

- name: Collect the K3s install script inputs
  vars:
    # extra_install_envs is overridden by the required keys on purpose.
    _install_envs: >-
      {{ extra_install_envs | default({}) | combine({
           'INSTALL_K3S_SKIP_START': 'true',
           'INSTALL_K3S_SYSTEMD_DIR': systemd_dir,
           'INSTALL_K3S_VERSION': k3s_version,
           'INSTALL_K3S_EXEC': 'agent --server https://' ~ (api_endpoint | ansible.utils.ipwrap) ~ ':' ~ api_port ~ ' ' ~ extra_agent_args}) }}
  ansible.builtin.set_fact:
    k3s_agent_install_envs: "{{ _install_envs }}"
    k3s_agent_install_digest: "{{ _install_envs | to_json(sort_keys=true) | hash('sha256') }}"
    k3s_agent_service_state_last: >-
      {{ (k3s_agent_service_state_recorded.content | b64decode | from_json)
         if k3s_agent_service_state_recorded.content is defined else {} }}

- name: Decide whether the K3s install script has to run
  ansible.builtin.set_fact:
    k3s_agent_install_needed: >-
      {{ k3s_agent_version_output.rc != 0
         or k3s_agent_installed_version is version(k3s_version, '<')
         or k3s_agent_service_state_last.install | default('') != k3s_agent_install_digest
         or (k3s_agent_service_state_last.files | default({}))[k3s_agent_unit_file] | default('')
            != k3s_agent_unit_stat.stat.checksum | default('absent') }}

# If airgapped, all K3s artifacts are already on the node.
# We should be downloading and installing the newer version only if we are in one of the following cases :
#   - we couldn't get k3s installed version in the first task of this role
#   - the installed version of K3s on the nodes is older than the requested version in ansible vars
- name: Download artifact only if needed
  when: airgap_dir is undefined and ( k3s_agent_version_output.rc != 0 or k3s_agent_installed_version is version(k3s_version, '<') )
  block:
    - name: Download K3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io/
        timeout: 120
        dest: /usr/local/bin/k3s-install.sh
        owner: root
        group: root
        mode: "0755"
        checksum: "{{ k3s_install_script_checksum or omit }}"

    - name: Set skip_download var for install script
      # noqa var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        skip_download: "false"

# The download step is skipped as needed. Check mode skips the script, and the
# recorded state written after the start reports the pending install instead.
- name: Run K3s install script
  when: k3s_agent_install_needed
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s-install.sh
  environment: "{{ k3s_agent_install_envs | combine({'INSTALL_K3S_SKIP_DOWNLOAD': skip_download | default('true')}) }}"
  changed_when: true

- name: Make config directory
  ansible.builtin.file:
    path: "/etc/rancher/k3s"
    mode: "0755"
    state: directory

- name: Copy config values
  when: agent_config_yaml is defined
  ansible.builtin.copy:
    content: "{{ agent_config_yaml }}"
    dest: "/etc/rancher/k3s/config.yaml"
    mode: "0644"
  register: k3s_agent_config_result

- name: Get the token from the first server
  when: token is not defined and hostvars[groups[server_group][0]].random_token is defined
  # noqa var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    token: "{{ hostvars[groups[server_group][0]].random_token }}"

- name: Add service environment variables
  when: extra_service_envs is defined
  ansible.builtin.lineinfile:
    path: "{{ k3s_agent_env_file }}"
    line: "{{ item }}"
  loop: "{{ extra_service_envs }}"
  register: k3s_agent_env_result

- name: Delete any existing token from the environment if different from the new one
  ansible.builtin.lineinfile:
    state: absent
    path: "{{ k3s_agent_env_file }}"
    regexp: "^K3S_TOKEN=\\s*(?!{{ token | regex_escape }}\\s*$)"
  register: k3s_agent_env_token_removed

- name: Add the token for joining the cluster to the environment
  no_log: true # avoid logging the server token
  ansible.builtin.lineinfile:
    path: "{{ k3s_agent_env_file }}"
    line: "{{ item }}"
  loop:
    - "K3S_TOKEN={{ token }}"
  register: k3s_agent_env_token_added

# The same record as in the k3s_server role: the checksums of the files K3s
# starts from, compared with the ones it last started with. Check mode writes
# none of the files, so it counts a pending write or install as a difference.
- name: Read the checksums of the files K3s starts from
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/k3s
    - "{{ k3s_agent_unit_file }}"
    - "{{ k3s_agent_env_file }}"
    - /etc/rancher/k3s/config.yaml
  register: k3s_agent_service_files

- name: Decide whether K3s has to restart
  vars:
    _files: >-
      {{ dict(k3s_agent_service_files.results | map(attribute='item')
         | zip(k3s_agent_service_files.results | map(attribute='stat.checksum', default='absent'))) }}
  ansible.builtin.set_fact:
    k3s_agent_service_state:
      install: "{{ k3s_agent_install_digest }}"
      files: "{{ _files }}"
    k3s_agent_restart_needed: >-
      {{ _files != k3s_agent_service_state_last.files | default({})
         or (ansible_check_mode
             and (k3s_agent_install_needed
                  or k3s_agent_config_result is changed
                  or k3s_agent_env_result is changed
                  or k3s_agent_env_token_removed is changed
                  or k3s_agent_env_token_added is changed)) }}

- name: Reload systemd daemon
  when:
    - k3s_agent_restart_needed
    - ansible_facts['service_mgr'] == 'systemd'
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart K3s agent
  when:
    - k3s_agent_restart_needed
    - not k3s_agent_check_on_clean_host
  ansible.builtin.service:
    name: k3s-agent
    state: restarted
    enabled: true

- name: Enable and start K3s agent
  when:
    - not k3s_agent_restart_needed
    - not k3s_agent_check_on_clean_host
  ansible.builtin.service:
    name: k3s-agent
    state: started
    enabled: true

# Written only once the service is up with the files above, so a run that fails
# before this point restarts on the next one.
- name: Record the state K3s started with
  ansible.builtin.copy:
    content: "{{ k3s_agent_service_state | to_nice_json }}\n"
    dest: "{{ k3s_service_state_file }}"
    owner: root
    group: root
    mode: "0600"

# A restart takes the kubelet down, and a node whose kubelet is down reports
# NotReady. Under a serialised agent play this gate holds the batch until the
# node carries workload again, and passes at once on a node that did not restart.
- name: Wait for this agent to report Ready
  when: k3s_wait_ready | bool
  # An agent holds no kubeconfig, so the read runs on the first server. The node
  # name comes from a fact of this agent, which delegation does not replace.
  delegate_to: "{{ groups[server_group][0] }}"
  ansible.builtin.command:
    cmd: >-
      k3s kubectl get node {{ k3s_agent_node_name }}
      -o=jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: k3s_agent_node_ready
  until: k3s_agent_node_ready.rc == 0 and k3s_agent_node_ready.stdout == 'True'
  retries: 30
  delay: 10
  changed_when: false
